<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FinTech Platform — B2B SaaS · Case Study</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --brand:#F07728;--ink:#1a1a1a;--ink-mid:#4a4a4a;--ink-light:#767676;
  --divider:#f0ece8;--border:#e2e8f0;--f:'Manrope',system-ui,sans-serif;
  --pad:clamp(1.25rem,5%,5rem);
}
html{font-family:var(--f);background:#fff;color:var(--ink);-webkit-font-smoothing:antialiased}
body{min-height:100vh}
a{color:inherit;text-decoration:none}

.nav{position:sticky;top:0;z-index:100;background:rgba(255,255,255,0.97);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--divider)}
.nav-inner{display:flex;align-items:center;justify-content:space-between;padding:0 var(--pad);height:60px;max-width:1440px;margin:0 auto}
.nav-back{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--ink-mid);transition:color 0.2s}
.nav-back:hover{color:var(--brand)}
.nav-tag{font-size:12px;color:var(--ink-light)}

.cs-image{display:block;width:100%;max-width:1440px;margin:0 auto;image-rendering:-webkit-optimize-contrast;image-rendering:optimizeQuality;-webkit-font-smoothing:antialiased;transform:translateZ(0);-webkit-transform:translateZ(0);will-change:transform;filter:contrast(1.04) saturate(1.03)}

.cs-footer{border-top:1px solid var(--divider);padding:2rem var(--pad);display:flex;justify-content:space-between;align-items:center;max-width:1440px;margin:0 auto;flex-wrap:wrap;gap:1rem}
.footer-back{display:flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--brand)}
.footer-copy{font-size:12px;color:var(--ink-light)}
</style>
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="nav-back">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      Back to portfolio
    </a>
    <span class="nav-tag">FinTech Platform &middot; Case Study</span>
  </div>
</nav>

<img src="fintech-casestudy-full.svg" alt="FinTech Platform — B2B SaaS Case Study" class="cs-image">

<footer class="cs-footer">
  <a href="index.html" class="footer-back">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    Back to portfolio
  </a>
  <div class="footer-copy">Apurva Deshpande &middot; UX Designer</div>
</footer>

</body>
</html>
